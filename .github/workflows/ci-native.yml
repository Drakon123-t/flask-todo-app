name: Flask CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fix imports for CI
      run: |
        # Создаем символические ссылки, чтобы Python видел модули из папки application
        ln -s application/controllers controllers || true
        ln -s application/configs configs || true
        ln -s application/extensions.py extensions.py || true

    - name: Initialize Database
      run: |
        python manage.py db upgrade

    - name: Smoke test Flask server
      run: |
        python manage.py runserver > flask.log 2>&1 &
        sleep 7
        curl -f http://127.0.0.1:7345/ || (cat flask.log && exit 1)